<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Package Pickup Tracker</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="/assets/bmc-logo.jpeg" alt="BMC Collectibles">
        <div>
          <h1>Package Pickup Tracker</h1>
          <p>Track incoming sealed case shipments and keep receiving work visible.</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="primary" type="button"><span aria-hidden="true">&#8635;</span> Refresh</button>
        <button id="emailButton" class="secondary" type="button"><span aria-hidden="true">&#9993;</span> Email alert</button>
        <button id="smsButton" class="secondary" type="button" disabled><span aria-hidden="true">&#128172;</span> Text alert</button>
        <button id="recipientSettingsButton" class="settings-button" type="button"><span aria-hidden="true">&#9881;</span> Recipients</button>
      </div>
    </header>

    <dialog id="recipientDialog" class="settings-dialog" aria-labelledby="recipientsTitle">
      <div class="dialog-header">
        <div>
          <h2 id="recipientsTitle">Recipients</h2>
          <p id="recipientSource" class="settings-note"></p>
        </div>
        <button id="closeRecipientDialog" class="icon-button" type="button" aria-label="Close recipients">x</button>
      </div>
      <form id="adminPasswordForm" class="password-form">
        <input id="adminPassword" name="adminPassword" type="password" autocomplete="current-password" placeholder="Admin password">
        <button class="secondary" type="submit">Unlock</button>
      </form>
      <div id="recipientSections" class="recipient-sections">
        <section class="recipient-section">
          <h3>Email</h3>
          <form id="emailRecipientForm" class="recipient-form">
            <input id="recipientEmail" name="recipientEmail" inputmode="email" autocomplete="email" placeholder="email@example.com">
            <button class="secondary" type="submit">Add email</button>
          </form>
          <div id="emailRecipientList" class="recipient-list" aria-live="polite"></div>
        </section>
        <section class="recipient-section">
          <h3>Text</h3>
          <form id="smsRecipientForm" class="recipient-form">
            <input id="recipientPhone" name="recipientPhone" inputmode="tel" autocomplete="tel" placeholder="+1 phone number">
            <button class="secondary" type="submit">Add phone</button>
          </form>
          <div id="smsRecipientList" class="recipient-list" aria-live="polite"></div>
        </section>
      </div>
    </dialog>

    <main>
      <section class="entry-panel">
        <form id="addForm">
          <label for="trackingNumbers">Tracking numbers</label>
          <textarea id="trackingNumbers" name="trackingNumbers" rows="5" placeholder="Paste one or many tracking numbers"></textarea>
          <div class="form-row">
            <select id="carrier" name="carrier" aria-label="Carrier">
              <option value="auto">Auto carrier</option>
              <option value="ups">UPS</option>
              <option value="fedex">FedEx</option>
              <option value="usps">USPS</option>
            </select>
            <input id="description" name="description" placeholder="Product, quantity, or note">
            <button class="primary" type="submit">Add tracking</button>
          </div>
        </form>
      </section>

      <section class="summary-grid" aria-live="polite">
        <div>
          <span id="pickupCount">0</span>
          <p>Ready for pickup</p>
        </div>
        <div>
          <span id="activeCount">0</span>
          <p>Active packages</p>
        </div>
        <div>
          <span id="outForDeliveryCount">0</span>
          <p>Out for delivery</p>
        </div>
        <div>
          <span id="pickedUpCount">0</span>
          <p>Received</p>
        </div>
      </section>

      <section class="toolbar">
        <div class="toolbar-controls">
          <div class="tabs" role="tablist" aria-label="Package filters">
            <button class="tab active" data-filter="active">Active</button>
            <button class="tab" data-filter="needs_pickup">Needs pickup</button>
            <button class="tab" data-filter="out_for_delivery">Out for delivery</button>
            <button class="tab" data-filter="picked_up">Received</button>
            <button class="tab" data-filter="all">All</button>
          </div>
          <label class="search-field">
            <span>Search packages</span>
            <input id="packageSearch" type="search" autocomplete="off" placeholder="Search tracking, product, seller, or notes">
          </label>
        </div>
        <p id="statusMessage"></p>
      </section>

      <section>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tracking</th>
                <th>Status</th>
                <th>Carrier update</th>
                <th>ETA</th>
                <th>Last checked</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="packageRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
